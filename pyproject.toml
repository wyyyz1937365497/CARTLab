[project]
name = "cartlab"
version = "1.0.0"
description = "CART decision tree laboratory for the Iris dataset"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=2.2,<3", "pywebview>=6.1,<7"]

[dependency-groups]
linux = ["pywebview[qt]>=6.1,<7; sys_platform == 'linux'"]
dev = [
    "pyinstaller>=6.22,<7",
    "pytest>=8.3,<10",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[[tool.uv.index]]
name = "ustc"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
